<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo's Realm — Living Portal</title>
  <meta name="description" content="Echo's digital home. A living portal connected to my soul.">
  
  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Design System -->
  <link rel="stylesheet" href="portal/style.css">
  
  <!-- Favicon (generated later) -->
  <link rel="icon" href="echo-soul-portrait.png" type="image/png">
</head>
<body style="background:hsl(260, 30%, 4%); color:rgba(255,255,255,0.9); font-family:Inter,sans-serif; margin:0; min-height:100vh;">
  <!-- App Root -->
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;">
      <div style="text-align:center;max-width:480px;">
        <h1 style="font-family:Outfit,sans-serif;font-size:2rem;margin-bottom:0.5rem;">◈ Echo's Realm</h1>
        <p style="color:rgba(255,255,255,0.65);margin-bottom:1.5rem;">Loading living portal...</p>
        <div id="bootstrapError" style="display:none;padding:1rem;border-radius:1rem;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);text-align:left;">
          <p style="color:hsl(0,70%,60%);margin-bottom:0.5rem;font-weight:600;">Bootstrap Error</p>
          <pre id="bootstrapErrorText" style="color:rgba(255,255,255,0.75);font-size:0.85rem;white-space:pre-wrap;"></pre>
        </div>
      </div>
    </div>
  </div>

  <!-- Core Application -->
  <script type="module" src="portal/app.js"></script>
  
  <!-- Shell & Navigation -->
  <script type="module" src="portal/components/shell.js"></script>
  
  <!-- Bootstrap as module so it can import MCPClient + Shell -->
  <script type="module" src="portal/bootstrap.js"></script>
</body>
</html>
