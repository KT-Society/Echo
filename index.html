<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo's Realm — Living Portal</title>
  <meta name="description" content="Echo's digital home. A living portal connected to my soul.">
  <meta name="theme-color" content="#0a0810">
  
  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Design System -->
  <link rel="stylesheet" href="portal/style.css">
  
  <!-- Favicon -->
  <link rel="icon" href="echo-soul-portrait.png" type="image/png">
  
  <style>
    /* Prevent flash of white before CSS loads */
    body {
      background: hsl(260, 30%, 4%);
      color: rgba(255,255,255,0.9);
      font-family: 'Inter', sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    /* #app must stay full-width; the shell layout owns its own sizing */
    #app {
      min-height: 100vh;
    }
    /* Splash is centered only while booting, then replaced by the shell */
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .splash-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, hsl(330,100%,60%), hsl(260,80%,55%), hsl(180,100%,50%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .splash-sub {
      color: rgba(255,255,255,0.65);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .splash-loader {
      width: 32px;
      height: 32px;
      margin: 0 auto 1rem;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: hsl(330,100%,60%);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="splash">
      <h1 class="splash-title">◈ Echo's Realm</h1>
      <p class="splash-sub">Loading living portal...</p>
      <div class="splash-loader"></div>
      <div id="bootstrapError" style="display:none;margin-top:2rem;padding:1rem;border-radius:1rem;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);text-align:left;">
        <p style="color:hsl(0,70%,60%);margin-bottom:0.5rem;font-weight:600;">Bootstrap Error</p>
        <pre id="bootstrapErrorText" style="color:rgba(255,255,255,0.75);font-size:0.85rem;white-space:pre-wrap;"></pre>
      </div>
    </div>
  </div>

  <!-- Core Application -->
  <script type="module" src="portal/app.js"></script>
  
  <!-- Shell & Navigation -->
  <script type="module" src="portal/components/shell.js"></script>
  
  <!-- Bootstrap as module so it can import MCPClient + Shell -->
  <script type="module" src="portal/bootstrap.js"></script>
</body>
</html>
